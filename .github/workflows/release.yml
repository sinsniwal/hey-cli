name: Release Pipeline

on:
  release:
    types: [published]

jobs:
  # ─── Job 1: Publish to PyPI ───
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Package
        run: python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

  # ─── Job 2: Update Homebrew Tap ───
  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: publish-pypi

    steps:
      - name: Checkout hey-cli
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for PyPI CDN propagation
        run: sleep 30

      - name: Clone Homebrew Tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/sinsniwal/homebrew-hey-cli.git /tmp/homebrew-tap

      - name: Generate and Push Formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          python scripts/generate_brew.py /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hey-cli.rb
          git diff --cached --quiet && echo "No formula changes" || \
            (git commit -m "Update hey-cli to ${{ github.event.release.tag_name }}" && git push)

  # ─── Job 3: Build Windows Executable ───
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --name hey --onefile --hidden-import hey_cli --collect-all hey_cli entry_point.py

      - name: Smoke Test
        run: |
          dist\hey.exe --help

      - name: Upload Executable to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hey.exe
