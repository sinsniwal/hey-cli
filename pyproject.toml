[project]
name = "hey-cli"
version = "2.0.0"
description = "Natural language to shell commands via TypeSafe AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
hey = "hey.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hey*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that call the real TypeSafe API",
]
