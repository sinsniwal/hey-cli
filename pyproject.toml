[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hey-cli"
version = "1.0.0"
description = "A secure, zero-bloat CLI companion that turns natural language and error logs into executable commands."
readme = "myplan.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "ollama>=0.1.0",
    "rich>=13.0.0"
]

[project.scripts]
hey = "hey_cli.cli:main"

[tool.setuptools]
packages = ["hey_cli"]
